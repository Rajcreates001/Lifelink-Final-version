# ============================================================
# LifeLink — CI Pipeline
# Runs on every PR push to main and any branch push.
# ============================================================

name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  POSTGRES_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/lifelink_test_db"
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: lifelink_test_db
  JWT_SECRET: ci-test-secret-do-not-use-in-production-abc123xyz

jobs:

  # ────── JOB 1: Frontend Lint & Build ─────────────────────
  frontend:
    name: "Frontend: Lint + Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint
        continue-on-error: true  # ⚠️ Known: eslint config is strict; demote to warning

      - name: Build (Vite)
        run: npm run build

      # ⏳ Cache frontend build output for potential deploy jobs
      - name: Cache build output
        uses: actions/cache/save@v4
        with:
          path: client/dist
          key: frontend-build-${{ github.sha }}


  # ────── JOB 2: Backend Lint ─────────────────────────────
  backend-lint:
    name: "Backend: Lint (flake8)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 app/ --config=../.flake8
          flake8 ml/ --config=../.flake8
          flake8 scripts/ --config=../.flake8
          flake8 ../tests/ --config=../.flake8


  # ────── JOB 3: Backend Tests ────────────────────────────
  backend-test:
    name: "Backend: Tests (pytest)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U postgres -d lifelink_test_db
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 15s

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd redis-cli ping
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run backend tests
        env:
          POSTGRES_URL: ${{ env.POSTGRES_URL }}
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ${{ env.JWT_SECRET }}
          LIFELINK_BASE_URL: http://127.0.0.1:3001
        run: |
          cd ..
          python -m pytest tests/ -v --timeout=60 -x
        # ⚠️ continue-on-error NOT set: tests must pass for CI green
        # When coverage rises above 10%, remove the -x flag


  # ────── JOB 4: Docker Compose Build ─────────────────────
  docker-build:
    name: "Docker: Compose Build Verification"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images (no start)
        run: |
          docker compose build --parallel

      - name: Verify images exist
        if: success()
        run: |
          echo "=== Built images ==="
          docker images --filter "reference=lifelink-*" --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
          echo "=== All images built successfully ==="


  # ────── JOB 5: Dependency Audit ─────────────────────────
  audit:
    name: "Security: Dependency Audit"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: npm audit (frontend)
        run: |
          cd client
          npm audit --audit-level=high || echo "⚠️  npm audit found issues (non-blocking)"
        continue-on-error: true

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: pip-audit (backend)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --desc on || echo "⚠️  pip-audit found issues (non-blocking)"
        continue-on-error: true


  # ────── JOB 6: TypeScript Type-Check (future) ──────────
  # ⏳ Skipped: Frontend is 100% .jsx — no TypeScript yet.
  # Uncomment when TypeScript migration begins:
  #
  # typescript:
  #   name: "Frontend: TypeScript Check"
  #   runs-on: ubuntu-latest
  #   defaults:
  #     run:
  #       working-directory: client
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4 with { node-version: "20", cache: "npm" }
  #     - run: npm ci
  #     - run: npx tsc --noEmit


  # ────── JOB 7: Summary ─────────────────────────────────
  ci-summary:
    name: "📋 CI Summary"
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend-lint
      - backend-test
      - docker-build
      - audit
    if: always()

    steps:
      - name: Generate summary
        id: summary
        uses: actions/github-script@v7
        with:
          script: |
            const summary = [];
            const jobs = [
              { name: "Frontend Lint + Build", status: "${{ needs.frontend.result }}" },
              { name: "Backend Lint (flake8)",  status: "${{ needs.backend-lint.result }}" },
              { name: "Backend Tests (pytest)",  status: "${{ needs.backend-test.result }}" },
              { name: "Docker Compose Build",    status: "${{ needs.docker-build.result }}" },
              { name: "Dependency Audit",        status: "${{ needs.audit.result }}" },
            ];

            summary.push("## ✅ CI Pipeline Results\n");
            summary.push("| Check | Status |");
            summary.push("|-------|--------|");
            for (const job of jobs) {
              const icon = job.status === "success" ? "✅" : job.status === "failure" ? "❌" : "⚠️";
              summary.push(`| ${job.name} | ${icon} ${job.status} |`);
            }

            const failures = jobs.filter(j => j.status === "failure").length;
            if (failures === 0) {
              summary.push("\n**All checks passed!** 🚀");
            } else {
              summary.push(`\n**${failures} check(s) failed** — review the logs above.`);
            }

            await core.summary.addRaw(summary.join("\n"));
            await core.summary.write();
