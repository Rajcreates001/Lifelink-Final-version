# LifeLink CI/CD Pipeline
# Runs on every push/PR: lint, test, build, Docker image, and deploy

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: Frontend Tests ─────────────────────────────────
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Ratcheting lint gate: fails only when the problem count grows beyond
      # the committed baseline. Tighten the baseline as errors get fixed —
      # update LINT_BASELINE in this file and lint-baseline.txt together.
      - name: Run ESLint (ratcheting gate)
        run: |
          LINT_BASELINE=$(cat .lint-baseline)
          npx eslint src/ -f json -o /tmp/eslint.json || true
          COUNT=$(node -e "const r=require('/tmp/eslint.json');console.log(r.reduce((a,f)=>a+f.errorCount+f.warningCount,0))")
          echo "ESLint problems: $COUNT (baseline: $LINT_BASELINE)"
          if [ "$COUNT" -gt "$LINT_BASELINE" ]; then
            echo "::error::ESLint problem count ($COUNT) exceeds baseline ($LINT_BASELINE). Fix new lint errors or lower the baseline after cleanup."
            exit 1
          fi

      - name: Run unit tests
        run: npx vitest run --reporter=verbose

      - name: Build frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: client/dist/
          retention-days: 7

  # ─── Job 1b: Secret Scanning ────────────────────────────────
  secret-scanning:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Job 2: Backend Tests ──────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: lifelink
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: lifelink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run linting (ratcheting gate)
        # Ratchet pattern: CI fails only when the flake8 violation count grows
        # beyond backend/.flake8-baseline. Fix code, then LOWER the baseline.
        # Config in backend/.flake8 documents all deliberate ignores.
        run: |
          pip install flake8
          BASELINE=$(cat .flake8-baseline)
          COUNT=$(flake8 app/ --count -qq | tail -1)
          echo "flake8 violations: $COUNT (baseline: $BASELINE)"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::flake8 violation count ($COUNT) exceeds baseline ($BASELINE). Fix the new violations, then lower .flake8-baseline."
            flake8 app/ --count
            exit 1
          fi

      - name: Run type checks (advisory)
        # mypy is informational for now — the codebase is untyped and gating on
        # it would block all PRs. Treat its output as a cleanup backlog; promote
        # to a hard gate once app/core has full annotations.
        continue-on-error: true
        run: |
          pip install mypy
          mypy app/ --ignore-missing-imports --no-error-summary

      - name: Run backend tests (with coverage ratchet)
        # Tests live at the repo ROOT (tests/), not backend/ — run from there.
        # Coverage floor is a ratchet: raise it as coverage improves, never lower.
        working-directory: .
        env:
          JWT_SECRET: test-secret-key-for-ci
          DATABASE_URL: postgresql://lifelink:test_password@localhost:5432/lifelink_test
          REDIS_URL: redis://localhost:6379
          MONGODB_URI: mongodb://localhost:27017/lifelink_test
          ENCRYPTION_KEY: test-encryption-key-for-ci-only
        run: |
          pip install pytest-cov
          # Hermetic suites only here: test_unit. The other suites under tests/
          # (test_security, test_ai, test_privacy, test_data) are live-server
          # integration tests — they run in the e2e job once a server is up.
          pytest tests/test_unit tests/test_performance -v --tb=short -x \
            --cov=backend/app --cov-report=term-missing:skip-covered \
            --cov-fail-under=$(cat tests/coverage_floor.txt)
          python -c "import sys; sys.path.insert(0, 'backend'); from app.main import app; print('Backend imports OK')"

  # ─── Job 3: E2E API Tests ─────────────────────────────────
  e2e-tests:
    name: E2E API Tests
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests, secret-scanning]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: lifelink
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: lifelink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Python dependencies
        run: pip install requests

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: npm run build

      - name: Start backend server
        env:
          JWT_SECRET: test-secret-key-for-ci
          DATABASE_URL: postgresql://lifelink:test_password@localhost:5432/lifelink_test
          REDIS_URL: redis://localhost:6379
          MONGODB_URI: mongodb://localhost:27017/lifelink_test
          ENCRYPTION_KEY: test-encryption-key-for-ci-only
        run: |
          cd backend
          pip install -r requirements.txt
          python -m uvicorn app.main:app --host 0.0.0.0 --port 3001 &
          sleep 15

      - name: Start frontend dev server
        working-directory: client
        run: |
          npm run preview -- --port 5000 &
          sleep 5

      - name: Run E2E API tests
        run: python tests/e2e_api_endpoints.py --base-url http://localhost:3001

      - name: Run live-server integration suites
        # These suites are requests-based checks against a running backend.
        # They previously ran (and failed) in the backend-tests job where no
        # server existed — they belong here, after the server is up.
        env:
          LIFELINK_BASE_URL: http://localhost:3001
          JWT_SECRET: test-secret-key-for-ci
        run: pytest tests/test_security tests/test_ai tests/test_privacy tests/test_data -v --tb=short

      - name: Run E2E validation tests
        run: |
          cd tests
          python e2e_validation.py || true

  # ─── Job 4: Docker Build ───────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests, secret-scanning]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image

# ─── Deployments ─────────────────────────────────────────────
# Deployment is owned by .github/workflows/deploy.yml (Render + Vercel hooks).
# The previous SSH-based staging/production jobs in this file were removed:
# they referenced unconfigured secrets (STAGING_HOST etc.) and placeholder
# domains (staging.lifelink.example.com), so they could never succeed.
