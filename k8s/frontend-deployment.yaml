apiVersion: apps/v1
kind: Deployment
metadata:
  name: lifelink-frontend
  labels:
    app: lifelink
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lifelink
      component: frontend
  template:
    metadata:
      labels:
        app: lifelink
        component: frontend
    spec:
      containers:
        - name: frontend
          image: lifelink-frontend:latest
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: lifelink-frontend
spec:
  selector:
    app: lifelink
    component: frontend
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lifelink-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - lifelink.yourdomain.com
      secretName: lifelink-tls
  rules:
    - host: lifelink.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lifelink-frontend
                port:
                  number: 5000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: lifelink-backend
                port:
                  number: 4002
          - path: /v2
            pathType: Prefix
            backend:
              service:
                name: lifelink-backend
                port:
                  number: 4002
