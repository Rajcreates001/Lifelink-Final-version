# ============================================================
# LifeLink - Docker Compose (Docker CE in WSL2)
# All persistent data stored on D: drive
# ============================================================

# ─── Shared Configuration ─────────────────────────────────
x-backend-env: &backend-env
  POSTGRES_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/lifelink_db
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  APP_ENV: development
  JWT_SECRET: c4e4bfbcd9e4e3a0a79508c19d2beb07067343183e66b0511260b0a7bfe17f5a
  PRIVACY_SALT: change_me_in_production
  FRONTEND_URL: http://localhost:5000
  HOST: "0.0.0.0"
  PORT: 3001
  LLM_PROVIDER: openai
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}

x-healthy-postgres: &healthy-pg
  condition: service_healthy

x-healthy-redis: &healthy-redis
  condition: service_healthy

services:
  # ─── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: lifelink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: lifelink_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7
    container_name: lifelink-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Backend API ──────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lifelink-backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - ./scripts:/app/scripts
      - backend_node_modules:/app/node_modules
    environment:
      <<: *backend-env
    command: ["api"]
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; print(urllib.request.urlopen('http://localhost:3001/health').status)"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ─── Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: lifelink-frontend
    restart: unless-stopped
    volumes:
      - ./client:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3001
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5000"]
    ports:
      - "5000:5000"
    depends_on:
      backend:
        condition: service_healthy

# ─── Named Volumes ───────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  backend_node_modules:
  frontend_node_modules:
