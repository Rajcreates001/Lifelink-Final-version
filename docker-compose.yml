# ============================================================
# LifeLink - Docker Compose
# ============================================================
# Services: PostgreSQL, Redis, Backend API, Celery Worker,
#           Celery Beat, Frontend
#
# Quick start:
#   docker compose up -d postgres redis backend frontend
#   (SIE is opt-in: docker compose --profile ai up sie)
# ============================================================

# ─── Shared Configuration ─────────────────────────────────
x-backend-env: &backend-env
  POSTGRES_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/lifelink_db
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  APP_ENV: development
  JWT_SECRET: ${JWT_SECRET:-change_me_before_deploy}
  PRIVACY_SALT: ${PRIVACY_SALT:-change_me_before_deploy}
  FRONTEND_URL: http://localhost:5000
  HOST: "0.0.0.0"
  PORT: "3001"
  LLM_PROVIDER: openai
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  # ─── AI Infrastructure: Headroom (Context Compression) ──────
  HEADROOM_ENABLED: ${HEADROOM_ENABLED:-true}
  # ─── AI Infrastructure: SIE (Superlinked Inference Engine) ──
  SIE_ENABLED: ${SIE_ENABLED:-false}
  SIE_BASE_URL: ${SIE_BASE_URL:-http://sie:8080}
  SIE_API_KEY: ${SIE_API_KEY:-}
  # ─── AI Infrastructure: Edge AI (Ambulance Runtime) ─────────
  EDGE_AI_ENABLED: ${EDGE_AI_ENABLED:-false}
  # ─── AI Infrastructure: Feature Flags ──────────────────────
  ENABLE_SEMANTIC_SEARCH: ${ENABLE_SEMANTIC_SEARCH:-true}
  ENABLE_RERANKING: ${ENABLE_RERANKING:-true}
  ENABLE_AI_STRUCTURED_OUTPUT: ${ENABLE_AI_STRUCTURED_OUTPUT:-true}
  ENABLE_OFFLINE_AMBULANCE_MODE: ${ENABLE_OFFLINE_AMBULANCE_MODE:-false}
  ENABLE_AI_OBSERVABILITY: ${ENABLE_AI_OBSERVABILITY:-true}
  ENABLE_SCRAPLING_SEARCH: ${ENABLE_SCRAPLING_SEARCH:-true}

services:
  # ─── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: lifelink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: lifelink_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "lifelink_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lifelink-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ─── Backend API ──────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: lifelink-mern-v4-backend:latest
    container_name: lifelink-backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
    environment:
      <<: *backend-env
    command: ["api"]
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3001/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── Celery Worker ───────────────────────────────────────────
  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: lifelink-mern-v4-backend:latest
    container_name: lifelink-celery-worker
    restart: unless-stopped
    volumes:
      - ./backend:/app
    environment:
      <<: *backend-env
    command: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "app.core.celery_app", "inspect", "ping", "--timeout=5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─── Celery Beat (Scheduler) ────────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: lifelink-mern-v4-backend:latest
    container_name: lifelink-celery-beat
    restart: unless-stopped
    volumes:
      - ./backend:/app
    environment:
      <<: *backend-env
    command: ["beat"]
    depends_on:
      redis:
        condition: service_healthy

  # ─── SIE (Superlinked Inference Engine) ──────────────────────
  # Opt-in: only starts with --profile ai
  # Usage: docker compose --profile ai up sie
  sie:
    image: ghcr.io/superlinked/sie-server:latest-cpu-default
    container_name: lifelink-sie
    restart: unless-stopped
    profiles:
      - ai
    volumes:
      - sie-hf-cache:/app/.cache/huggingface
    ports:
      - "18080:8080"
    environment:
      - SIE_TELEMETRY_DISABLED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/readyz')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G

  # ─── Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: lifelink-frontend
    restart: unless-stopped
    ports:
      - "5000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

# ─── Named Volumes ───────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  sie-hf-cache:
