services:
  - type: web
    name: lifelink-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 3001
      - key: FRONTEND_URL
        sync: false
      - key: POSTGRES_URL
        fromDatabase:
          name: lifelink-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PRIVACY_SALT
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com
      - key: GROQ_MODEL
        value: llama3-8b-8192
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: REDIS_URL
        fromService:
          name: lifelink-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: lifelink-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: lifelink-redis
          property: connectionString
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: RAG_TOP_K
        value: "5"

  - type: redis
    name: lifelink-redis
    ipAllowList: []
    plan: free

databases:
  - name: lifelink-db
    plan: free
    databaseName: lifelink
    ipAllowList: []
