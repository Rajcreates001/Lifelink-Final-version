# LifeLink Staging Environment
# docker-compose -f docker-compose.staging.yml up -d

services:
  # ─── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: lifelink-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifelink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staging_password}
      POSTGRES_DB: lifelink
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifelink"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lifelink-staging-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend (FastAPI) ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lifelink-staging-backend
    restart: unless-stopped
    ports:
      - "4002:4002"
    environment:
      - DATABASE_URL=postgresql+asyncpg://lifelink:${POSTGRES_PASSWORD:-staging_password}@postgres:5432/lifelink
      - MONGODB_URI=mongodb://mongo:27017/lifelink
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-staging-jwt-secret-change-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - APP_ENV=staging
      - CORS_ORIGINS=["http://localhost:5000","https://staging.lifelink.example.com"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ml_models:/app/ml

  # ─── Frontend (Nginx) ──────────────────────────────────────
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: lifelink-staging-frontend
    restart: unless-stopped
    ports:
      - "5000:80"
    depends_on:
      - backend

volumes:
  pgdata_staging:
  ml_models:
