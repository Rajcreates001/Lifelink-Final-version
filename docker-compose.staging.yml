# LifeLink Staging Environment
# docker-compose -f docker-compose.staging.yml up -d

# ─── Shared Configuration ─────────────────────────────────
x-backend-env: &backend-env
  POSTGRES_URL: postgresql+asyncpg://lifelink:${POSTGRES_PASSWORD:-staging_password}@postgres:5432/lifelink
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  JWT_SECRET: ${JWT_SECRET:-staging-jwt-secret-change-in-production}
  PRIVACY_SALT: ${PRIVACY_SALT:-staging-privacy-salt}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  APP_ENV: staging
  PORT: "3001"
  FRONTEND_URL: http://localhost:5000
  HOST: "0.0.0.0"

services:
  # ─── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: lifelink-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifelink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staging_password}
      POSTGRES_DB: lifelink
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifelink -d lifelink"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lifelink-staging-redis
    restart: unless-stopped
    volumes:
      - redis_staging_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ─── Backend (FastAPI) ──────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lifelink-staging-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      <<: *backend-env
    command: ["api"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ml_models_staging:/app/ml
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3001/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── Celery Worker ───────────────────────────────────────────
  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lifelink-staging-celery-worker
    restart: unless-stopped
    environment:
      <<: *backend-env
    command: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ml_models_staging:/app/ml
    healthcheck:
      test: ["CMD", "celery", "-A", "app.core.celery_app", "inspect", "ping", "--timeout=5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─── Celery Beat ────────────────────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lifelink-staging-celery-beat
    restart: unless-stopped
    environment:
      <<: *backend-env
    command: ["beat"]
    depends_on:
      redis:
        condition: service_healthy

  # ─── Frontend (Nginx) ──────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: lifelink-staging-frontend
    restart: unless-stopped
    ports:
      - "5000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata_staging:
  redis_staging_data:
  ml_models_staging:
