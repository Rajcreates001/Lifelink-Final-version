apiVersion: apps/v1
kind: Deployment
metadata:
  name: lifelink-backend
  labels:
    app: lifelink
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lifelink
      component: backend
  template:
    metadata:
      labels:
        app: lifelink
        component: backend
    spec:
      containers:
        - name: backend
          image: lifelink-backend:latest
          ports:
            - containerPort: 4002
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lifelink-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lifelink-secrets
                  key: jwt-secret
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: lifelink-secrets
                  key: mongo-uri
            - name: REDIS_URL
              value: redis://lifelink-redis:6379
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: lifelink-secrets
                  key: encryption-key
                  optional: true
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: lifelink-secrets
                  key: sentry-dsn
                  optional: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4002
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: lifelink-backend
spec:
  selector:
    app: lifelink
    component: backend
  ports:
    - port: 4002
      targetPort: 4002
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lifelink-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lifelink-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
